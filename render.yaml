services:
  - type: web
    name: dca-drawdown-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: ACCESS_USER
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
